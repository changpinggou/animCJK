<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>科技改变生活 - 行书动态书写</title>
    <style>
        body { background: #fdfdfd; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        #canvas-container { 
            display: flex; 
            gap: 15px; 
            padding: 30px; 
            background: #fff; 
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        canvas { background: #fff; border: 1px solid #fafafa; }
        .title { font-size: 24px; color: #333; margin-bottom: 20px; font-weight: 300; }
    </style>
</head>
<body>

    <div class="title">正在书写：科技改变生活 (行书风格)</div>
    <div id="canvas-container"></div>

    <script>
        const targetSentence = ["科", "技", "改", "变", "生", "活"];

        async function startWriting() {
            // 加载包含牵丝连带的行书 Medians 数据库
            const response = await fetch('./graphicsZhHans_xingshu.txt');
            const text = await response.text();
            
            const db = new Map();
            text.trim().split('\n').forEach(line => {
                const data = JSON.parse(line);
                db.set(data.character, data);
            });

            const container = document.getElementById('canvas-container');

            for (const char of targetSentence) {
                const charData = db.get(char);
                if (!charData) continue;

                const canvas = document.createElement('canvas');
                canvas.width = 150;
                canvas.height = 150;
                container.appendChild(canvas);
                const ctx = canvas.getContext('2d');

                // 坐标系修正
                ctx.scale(150 / 1024, 150 / 1024);
                ctx.scale(1, -1);
                ctx.translate(0, -1024);

                // 遍历笔画
                for (let index = 0; index < charData.medians.length; index++) {
                    const stroke = charData.medians[index];
                    
                    // [cite_start]// 根据算法逻辑，奇数项通常是生成的“牵丝” [cite: 36]
                    // const isLigature = index % 2 !== 0; 
                    isLigature = false
                    
                    // 渲染笔画
                    await animateRunningStroke(ctx, stroke, isLigature);
                    
                    // 正式笔画写完后停顿，牵丝不需要停顿以保持连贯感
                    if (!isLigature) {
                        await new Promise(r => setTimeout(r, 60));
                    }
                }
            }
        }

        /**
         * 适配行书风格的单笔画渲染
         * @param {boolean} isLigature 是否为牵丝连带
         */
        async function animateRunningStroke(ctx, stroke, isLigature) {
            return new Promise(resolve => {
                let i = 0;
                // 牵丝书写速度更快
                const step = isLigature ? 3 : 1; 

                function draw() {
                    if (i >= stroke.length - 1) {
                        resolve();
                        return;
                    }

                    const [x1, y1] = stroke[i];
                    const [x2, y2] = stroke[Math.min(i + step, stroke.length - 1)];
                    
                    const t = i / stroke.length;
                    
                    ctx.beginPath();
                    
                    if (isLigature) {
                        // 牵丝：极细且半透明，模拟笔尖轻掠过纸面
                        ctx.lineWidth = 2; 
                        ctx.strokeStyle = 'rgba(44, 62, 80, 0.2)'; 
                    } else {
                        // [cite_start]// 正式笔画：较粗，且有动态压力变化 [cite: 36]
                        const pressure = 1.3 - Math.sin(t * Math.PI) * 0.5;
                        ctx.lineWidth = 15 * pressure; 
                        ctx.strokeStyle = '#2c3e50';
                    }

                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();

                    i += step;
                    requestAnimationFrame(draw);
                }
                draw();
            });
        }

        window.onload = startWriting;
    </script>
</body>
</html>
