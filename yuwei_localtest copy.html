        .char-box { width: 200px; height: 200px; border: 1px solid #eee; }
        
        /* 挂载手写感滤镜 */
        .handwritten-path {
            fill: #2c3e50;
            filter: url(#handwritten-filter);
            /* 禹卫行书原始路径是倒置的，需要翻转坐标系 */
