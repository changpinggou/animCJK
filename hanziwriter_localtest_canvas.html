<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>科技改变生活 - 动态手写演示</title>
    <style>
        body { background: #fdfdfd; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        #canvas-container { 
            display: flex; 
            gap: 15px; 
            padding: 30px; 
            background: #fff; 
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        canvas { background: #fff; border: 1px solid #fafafa; }
        .title { font-size: 24px; color: #333; margin-bottom: 20px; font-weight: 300; }
    </style>
</head>
<body>

    <div class="title">正在书写：科技改变生活</div>
    <div id="canvas-container"></div>

    <script>
        // 渲染目标汉字顺序
        const targetSentence = ["科", "技", "改", "变", "生", "活"];

        async function startWriting() {
            // 加载经过 GPU 增噪后的 Medians 数据库 
            const response = await fetch('./graphicsZhHans_median.txt');
            const text = await response.text();
            
            // 将文本解析为 Map，方便按字提取
            const db = new Map();
            text.trim().split('\n').forEach(line => {
                const data = JSON.parse(line);
                db.set(data.character, data);
            });

            const container = document.getElementById('canvas-container');

            // 按顺序书写每一个字
            for (const char of targetSentence) {
                const charData = db.get(char);
                if (!charData) continue;

                // 创建 Canvas [cite: 32]
                const canvas = document.createElement('canvas');
                canvas.width = 150;
                canvas.height = 150;
                container.appendChild(canvas);
                const ctx = canvas.getContext('2d');

                // 适配原始坐标系 (1024 -> 150)
                ctx.scale(150 / 1024, 150 / 1024);

                // 2. 绕 X 轴翻转：Y轴方向取反
                ctx.scale(1, -1);


                // 3. 向上平移：因为翻转后字在画布上方 (-1024处)，需要把它拉回到可视区
                // 注意：由于上面 scale(1, -1) 的影响，这里的平移量应为 -1024
                ctx.translate(0, -1024);

                // 逐笔书写
                for (const stroke of charData.medians) {
                    await animateStroke(ctx, stroke);
                    // await animateChalkStroke(ctx, stroke);
                    // 笔尖提起的小停顿
                    await new Promise(r => setTimeout(r, 80));
                }
            }
        }

        /**
         * 单笔画 Canvas 渲染逻辑
         */
        async function animateStroke(ctx, stroke) {
            return new Promise(resolve => {
                let i = 0;
                function draw() {
                    if (i >= stroke.length - 1) {
                        resolve();
                        return;
                    }

                    const [x1, y1] = stroke[i];
                    const [x2, y2] = stroke[i + 1];
                    
                    // 模拟压力：起笔重、行笔轻 [cite: 36]
                    const t = i / stroke.length;
                    const pressure = 1.3 - Math.sin(t * Math.PI) * 0.6;
                    
                    ctx.beginPath();
                    ctx.lineWidth = 10 * pressure; // 基础粗细
                    ctx.lineCap = 'round';
                    ctx.strokeStyle = '#2c3e50';
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();

                    i++;
                    requestAnimationFrame(draw);
                }
                draw();
            });
        }

        window.onload = startWriting;
    </script>
</body>
</html>
